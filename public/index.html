
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101010">
  <title>StreamFlix</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/app.js" defer></script>
</head>
<body>
  <header class="cabecalho">
    <a class="logo" href="/" aria-label="StreamFlix - início">
      Stream<span>Flix</span>
    </a>

    <div class="usuario">
      <img
        id="avatarUsuario"
        class="avatar"
        src="/imagens/perfil/goku.png"
        alt=""
      >
      <span id="nomeUsuario">@StreamFlix</span>
      <button id="btnPerfil" type="button" disabled>
        Ver Perfil
      </button>
      <button id="btnLogin" type="button">Entrar</button>
    </div>
  </header>

  <main class="conteudo">
    <section class="introducao">
      <p class="sobretitulo">SEU UNIVERSO DE FILMES</p>
      <h1>Descubra seu próximo filme.</h1>
      <p class="descricao">
        Explore o catálogo, conheça os curadores e compartilhe seus favoritos.
      </p>
    </section>

    <section class="catalogo" aria-labelledby="tituloCatalogo">
      <div class="catalogo-topo">
        <div>
          <h2 id="tituloCatalogo">Catálogo</h2>
          <p id="statusCatalogo" role="status">Carregando filmes...</p>
        </div>

        <form id="formBusca" class="busca">
          <label class="sr-only" for="campoBusca">
            Buscar administrador
          </label>
          <input
            id="campoBusca"
            type="search"
            placeholder="Digite o nome do administrador"
            autocomplete="off"
          >
          <button type="submit" aria-label="Buscar administrador">
            <img src="/icons/lupa.svg" alt="">
          </button>
        </form>
      </div>

      <div id="mensagem" class="mensagem" role="status" hidden></div>
      <div id="galeria" class="galeria"></div>
    </section>
  </main>

  <footer class="rodape">
    <a class="logo" href="/">Stream<span>Flix</span></a>
    <p>© 2026–2027 StreamFlix. Todos os direitos reservados.</p>
  </footer>
  
<dialog id="modalLogin" class="modal-login" aria-labelledby="tituloLogin">
  <div class="modal-topo">
    <h2 id="tituloLogin">Login</h2>

    <button
      id="btnFecharLogin"
      class="btn-fechar"
      type="button"
      aria-label="Fechar login"
    >×</button>
  </div>

  <form id="formLogin">
    <label for="loginUsuario">Nome de usuário</label>
    <input
      id="loginUsuario"
      name="nome_usuario"
      type="text"
      minlength="3"
      maxlength="50"
      autocomplete="username"
      required
    >

    <label for="loginSenha">Senha</label>
    <input
      id="loginSenha"
      name="senha"
      type="password"
      maxlength="200"
      autocomplete="current-password"
      required
    >

    <p id="erroLogin" class="erro-login" role="alert" hidden></p>

    <div class="modal-acoes">
      <button id="btnCancelarLogin" type="button" class="btn-cancelar">
        Cancelar
      </button>

      <button id="btnEnviarLogin" type="submit" class="btn-confirmar">
        Entrar
      </button>
    </div>
  </form>
</dialog>

</body>
</html>
